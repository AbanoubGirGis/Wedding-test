<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Guest notes</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #f7f1ea;
      --paper: #fffaf6;
      --gold: #c45c6a;
      --gold-deep: #7a3040;
      --ink: #2a1820;
      --ink-soft: #6d5360;
      --line: rgba(122, 48, 64, 0.28);
      --shadow: 0 22px 50px rgba(42, 18, 28, 0.12);
      --serif: "Cormorant Garamond", Palatino, serif;
      --arabic: "Amiri", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 100% 0%, rgba(196, 92, 106, 0.16), transparent 55%),
        var(--ivory);
      font-family: var(--serif);
      line-height: 1.6;
    }
    main { max-width: 860px; margin: 0 auto; padding: 3.2rem 1.2rem 4rem; }
    .mark, h1, .lead { text-align: center; }
    .mark { margin: 0; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-deep); font-size: 0.78rem; }
    .mark span, h1 span, .lead span, .error span, .count span, .card p span { display: block; }
    .mark span[lang="ar"], h1 span[lang="ar"], .lead span[lang="ar"], .error span[lang="ar"] {
      font-family: var(--arabic);
      letter-spacing: 0;
      text-transform: none;
    }
    h1 { margin: 0.35rem 0 0.4rem; font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.4rem); }
    h1 span[lang="ar"] { font-size: 0.72em; }
    .lead { margin: 0 0 1.6rem; color: var(--ink-soft); font-style: italic; }
    .lead span[lang="ar"] { font-style: normal; font-size: 1.25rem; color: var(--ink); }
    .gate, .card, .count {
      background: rgba(255, 252, 247, 0.82);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .gate { max-width: 420px; margin: 0 auto; padding: 1.4rem 1.2rem 1.3rem; }
    .gate input, .gate button, .filters button {
      width: 100%;
      font: inherit;
    }
    .gate input {
      display: block;
      margin: 0.8rem 0;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      text-align: center;
      font-size: 1.15rem;
      padding: 0.75rem;
    }
    .gate button, .filters button {
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold-deep);
      padding: 0.65rem 0.8rem;
      cursor: pointer;
    }
    .gate button:hover, .filters button:hover, .filters button.is-on {
      background: var(--gold);
      color: #fffaf3;
    }
    .error { margin: 0 0 0.4rem; text-align: center; color: var(--gold-deep); }
    .error span[lang="ar"] { font-family: var(--arabic); font-size: 1.2rem; }
    .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin: 1.4rem 0; }
    .count { text-align: center; padding: 0.9rem 0.4rem; }
    .count strong { display: block; font-size: 2rem; font-weight: 500; color: var(--gold-deep); }
    .count span[lang="ar"] { font-family: var(--arabic); }
    .count span[lang="en"] { color: var(--ink-soft); font-style: italic; font-size: 0.95rem; }
    .filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; margin-bottom: 1rem; }
    .filters button span { display: block; }
    .filters button span[lang="ar"] { font-family: var(--arabic); }
    .filters button span[lang="en"] { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .cards { display: grid; gap: 0.8rem; }
    .card { padding: 1.15rem 1.15rem 1rem; }
    .card header { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .card h2 { margin: 0; text-align: start; font-size: 1.7rem; font-weight: 500; }
    .meta { margin: 0.15rem 0 0.7rem; color: var(--gold-deep); font-size: 0.92rem; }
    .note { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--arabic), var(--serif); font-size: 1.2rem; line-height: 1.9; }
    .quiet { color: var(--ink-soft); font-style: italic; }
    .badge { border: 1px solid var(--line); padding: 0.15rem 0.55rem; font-size: 0.95rem; white-space: nowrap; }
    .badge span[lang="ar"] { font-family: var(--arabic); }
    .badge span[lang="en"] { color: var(--ink-soft); font-style: italic; font-size: 0.85rem; }
    .badge.is-no { opacity: 0.72; }
    .empty { text-align: center; color: var(--ink-soft); }
    .empty span { display: block; }
    .empty span[lang="ar"] { font-family: var(--arabic); font-size: 1.3rem; color: var(--ink); }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      .filters { grid-template-columns: 1fr 1fr; }
      .card header { display: block; }
      .badge { display: inline-block; margin-top: 0.45rem; }
    }
  </style>
</head>
<body>
  <main>
    <div id="gate-view">
      <p class="mark"><span lang="ar" dir="rtl">رسائل الضيوف</span><span lang="en">Guest notes</span></p>
      <h1><span lang="ar" dir="rtl">اللوحة الخاصة</span><span lang="en">Private board</span></h1>
      <p class="lead"><span lang="ar" dir="rtl">اكتب كلمة السر لفتح الرسائل</span><span lang="en">Enter the password to open the notes</span></p>
      <form id="gate" class="gate">
        <p id="gate-error" class="error" hidden><span lang="ar" dir="rtl">كلمة السر غير صحيحة</span><span lang="en">That password is not right</span></p>
        <input type="password" name="password" autocomplete="current-password" autofocus required>
        <button type="submit"><span lang="en">Open</span></button>
      </form>
    </div>
    <div id="board-view" hidden>
      <p class="mark"><span lang="ar" dir="rtl">رسائل الضيوف</span><span lang="en">Guest notes</span></p>
      <h1><span lang="ar" dir="rtl">ما وصل إلينا</span><span lang="en">What has arrived</span></h1>
      <div class="counts">
        <div class="count"><strong id="count-notes">0</strong><span lang="ar" dir="rtl">رسائل</span><span lang="en">Notes</span></div>
        <div class="count"><strong id="count-coming">0</strong><span lang="ar" dir="rtl">حاضر</span><span lang="en">Attending</span></div>
        <div class="count"><strong id="count-away">0</strong><span lang="ar" dir="rtl">معتذر</span><span lang="en">Regrets</span></div>
      </div>
      <div class="filters">
        <button type="button" class="is-on" data-filter="all"><span lang="ar" dir="rtl">الكل</span><span lang="en">All</span></button>
        <button type="button" data-filter="groom"><span lang="ar" dir="rtl">العريس</span><span lang="en">Groom</span></button>
        <button type="button" data-filter="bride"><span lang="ar" dir="rtl">العروسة</span><span lang="en">Bride</span></button>
        <button type="button" data-filter="both"><span lang="ar" dir="rtl">لكليهما</span><span lang="en">Both</span></button>
      </div>
      <div id="cards" class="cards"></div>
    </div>
  </main>
  <script>
    var gateView = document.getElementById("gate-view");
    var boardView = document.getElementById("board-view");
    var gate = document.getElementById("gate");
    var gateError = document.getElementById("gate-error");
    var cards = document.getElementById("cards");

    function pair(parent, ar, en) {
      var arabic = document.createElement("span");
      arabic.lang = "ar";
      arabic.dir = "rtl";
      arabic.textContent = ar;
      var english = document.createElement("span");
      english.lang = "en";
      english.textContent = en;
      parent.append(arabic, english);
    }

    function when(value) {
      var date = new Date(value);
      if (isNaN(date.getTime())) return "";
      var pad = function (n) { return String(n).padStart(2, "0"); };
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function show(notes) {
      gateView.hidden = true;
      boardView.hidden = false;
      var coming = notes.filter(function (note) { return note.attending; }).length;
      document.getElementById("count-notes").textContent = String(notes.length);
      document.getElementById("count-coming").textContent = String(coming);
      document.getElementById("count-away").textContent = String(notes.length - coming);
      cards.replaceChildren();
      if (!notes.length) {
        var empty = document.createElement("p");
        empty.className = "empty";
        pair(empty, "لا توجد رسائل بعد", "No notes yet");
        cards.append(empty);
        return;
      }
      var labels = {
        groom: ["العريس", "For the groom"],
        bride: ["العروسة", "For the bride"],
        both: ["لكليهما", "For both"]
      };
      notes.forEach(function (note) {
        var card = document.createElement("article");
        card.className = "card";
        card.setAttribute("data-to", note.to || "");
        var header = document.createElement("header");
        var title = document.createElement("h2");
        title.textContent = note.name || "";
        var badge = document.createElement("p");
        badge.className = "badge" + (note.attending ? "" : " is-no");
        pair(badge, note.attending ? "حاضر" : "معتذر", note.attending ? "Attending" : "Regrets");
        header.append(title, badge);
        var meta = document.createElement("p");
        meta.className = "meta";
        var who = labels[note.to] || labels.both;
        pair(meta, who[0], who[1]);
        meta.append(" · " + when(note.at));
        var body = document.createElement("p");
        body.className = note.message ? "note" : "note quiet";
        if (note.message) body.textContent = note.message;
        else pair(body, "بدون رسالة", "No message");
        card.append(header, meta, body);
        cards.append(card);
      });
    }

    document.querySelectorAll("[data-filter]").forEach(function (button) {
      button.addEventListener("click", function () {
        var filter = button.getAttribute("data-filter");
        document.querySelectorAll("[data-filter]").forEach(function (item) {
          item.classList.toggle("is-on", item === button);
        });
        document.querySelectorAll(".card").forEach(function (card) {
          card.hidden = filter !== "all" && card.getAttribute("data-to") !== filter;
        });
      });
    });

    function read(response) {
      if (!response.ok) throw new Error("closed");
      return response.json();
    }

    fetch("/api/board").then(read).then(function (data) {
      if (data && data.ok) show(data.notes || []);
    }).catch(function () {});

    gate.addEventListener("submit", function (event) {
      event.preventDefault();
      gateError.hidden = true;
      fetch("/api/board", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: gate.password.value })
      }).then(read).then(function (data) {
        if (data && data.ok) show(data.notes || []);
      }).catch(function () {
        gateError.hidden = false;
      });
    });
  </script>
</body>
</html>
